<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="闫老寨 · SmallVillage: a painted village to glide into, walk, fish and play through the seasons.">
  <title>SmallVillage · 闫老寨</title>
  <link rel="icon" href="/favicon.svg">
</head>
<body>
  <div id="v2-canvas"></div>
  <section class="v2-panel" aria-label="Village preview controls">
    <h1><button id="v2-toggle" type="button" aria-expanded="true" aria-controls="v2-controls">SmallVillage 2.0</button></h1>
    <div id="v2-controls" class="v2-controls">
    <p>Preview of the rebuilt village · Phase 8</p>
    <div class="v2-row">
      <label>Month <select id="v2-month">
        <option value="1">January</option><option value="2">February</option><option value="3">March</option>
        <option value="4">April</option><option value="5">May</option><option value="6">June</option>
        <option value="7">July</option><option value="8">August</option><option value="9">September</option>
        <option value="10">October</option><option value="11">November</option><option value="12">December</option>
      </select></label>
      <label>Sky <select id="v2-preset"></select></label>
    </div>
    <div class="v2-row">
      <label>View <select id="v2-view"></select></label>
      <button id="v2-walk" type="button">Walk</button>
      <label>Quality <select id="v2-quality"><option value="auto">Auto</option><option value="high">High</option><option value="low">Phone</option></select></label>
    </div>
    <span id="v2-status" role="status"></span>
    <span id="v2-info"></span>
    </div>
  </section>
  <div id="v2-map" class="v2-map" hidden aria-label="Painted map of the village: choose a place to land">
    <div class="v2-map-view"><img alt="Painted map of the village and its fields" draggable="false"><div class="v2-map-pins"></div></div>
  </div>
  <div id="v2-pins3d" class="v2-pins3d" hidden aria-label="Places in the 3D view"></div>
  <header class="v2-title"><h2>闫老寨 · 小村</h2><p>选一个地方，乘滑翔伞降落 · Choose a place and glide down</p></header>
  <nav class="v2-mode" aria-label="Map mode">
    <button type="button" data-mode="map" aria-pressed="true">地图 Map</button>
    <button type="button" data-mode="3d" aria-pressed="false">3D</button>
  </nav>
  <button id="v2-back" class="v2-back" type="button" hidden>↩ 地图 Map</button>
  <button id="v2-person" class="v2-person" type="button" hidden title="Switch view (V)">🧒 3rd</button>
  <p id="v2-where" class="v2-where" hidden></p>
  <div id="v2-pad" class="v2-pad" hidden aria-label="Walk controls">
    <button data-dir="forward" type="button" aria-label="Forward">▲</button>
    <button data-dir="left" type="button" aria-label="Left">◀</button>
    <button data-dir="back" type="button" aria-label="Back">▼</button>
    <button data-dir="right" type="button" aria-label="Right">▶</button>
  </div>
  <a class="v2-classic" href="/classic.html">旧版 Classic version</a>
  <p class="v2-hint">Orbit: drag, scroll · Walk: WASD, drag to look, Shift to run, V to switch view · F to fish at a pond edge, E for other activities, J for the journal</p>
  <script type="module" src="/src/v2/main.js"></script>
</body>
</html>
